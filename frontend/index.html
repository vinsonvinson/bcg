<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BCG - Credit Scoring System</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="login-page light-theme">
        <div class="login-container">
            <div class="login-wrapper">
                <div class="login-left">
                    <div class="">
                        <div class="text-center">
                            <img
                                src="images/logo.png"
                                alt="Logo BCG"
                                class="login-logo"
                            />
                        </div>
                    </div>
                    <h1>Hello, Welcome!</h1>
                    <a href="#" class="ready-btn">Ready to Assessment</a>
                </div>

                <div class="login-right">
                    <div class="login-form-wrapper">
                        <h2>Log In</h2>
                        <form id="loginForm">
                            <div class="form-group">
                                <label>Username</label>
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="Admin"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <div class="password-input-wrapper">
                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        placeholder="••••••"
                                        required
                                    />
                                    <span
                                        class="toggle-password"
                                        id="togglePassword"
                                        >👁️</span
                                    >
                                </div>
                            </div>
                            <button type="submit" class="login-btn">
                                Submit
                            </button>
                        </form>
                        <p class="login-help">
                            Please log in to manage your guarantee risk
                            assessment easily
                        </p>

                        <div
                            id="loginError"
                            class="error-message"
                            style="display: none"
                        ></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="theme-toggle">
            <button id="themeToggle" class="theme-btn">Dark Mode</button>
        </div>

        <script src="js/app.js"></script>
        <script src="js/auth.js"></script>
    </body>
</html>
