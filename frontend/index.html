<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCG - Credit Scoring System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page light-theme">
    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-left">
                <div class="bcg-logo">
                    <svg width="200" height="100" viewBox="0 0 200 100">
                        <!-- BCG Logo simplified version -->
                        <circle cx="30" cy="30" r="8" fill="#FFD700"/>
                        <circle cx="40" cy="30" r="8" fill="#FFD700"/>
                        <circle cx="50" cy="30" r="8" fill="#FFD700"/>
                        <circle cx="60" cy="30" r="8" fill="#FFD700"/>
                        <circle cx="70" cy="30" r="8" fill="#FFD700"/>
                        <text x="20" y="75" font-size="28" font-weight="bold" fill="#1976D2">BCG</text>
                        <text x="20" y="95" font-size="12" fill="#666">Credit Scoring System</text>
                    </svg>
                </div>
                <h1>Hello, Welcome!</h1>
                <p>Sistem Penilaian Kelayakan Kredit Berbasis 5C</p>
                <a href="#" class="ready-btn">Ready to Assessment</a>
            </div>

            <div class="login-right">
                <div class="login-form-wrapper">
                    <h2>Log In</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="username" name="username" placeholder="Admin" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="password" name="password" placeholder="••••••" required>
                                <span class="toggle-password" id="togglePassword">👁️</span>
                            </div>
                        </div>
                        <button type="submit" class="login-btn">Submit</button>
                    </form>
                    <p class="login-help">Please log in to manage your guarantee risk assessment easily</p>
                    
                    <div id="loginError" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="theme-toggle">
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
