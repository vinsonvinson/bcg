<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BCG - Dashboard</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="dashboard-page light-theme">
        <div class="app-container">
            <!-- Navbar -->
            <nav class="navbar">
                <div class="navbar-left">
                    <div class="bcg-logo-small">BCG</div>
                    <span class="nav-title">Assessment Dashboard</span>
                </div>
                <div class="navbar-right">
                    <button id="themeToggle" class="theme-btn">🌙</button>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </nav>

            <div class="dashboard-container">
                <!-- Sidebar Menu -->
                <aside class="sidebar">
                    <div
                        class="menu-item active"
                        onclick="showSection('overview')"
                    >
                        <span class="icon">📊</span>
                        <span>Overview</span>
                    </div>
                    <div class="menu-item" onclick="showSection('assessments')">
                        <span class="icon">📋</span>
                        <span>Assessments</span>
                    </div>
                    <div class="menu-item" onclick="navigateTo('/form')">
                        <span class="icon">➕</span>
                        <span>New Assessment</span>
                    </div>
                    <hr />
                </aside>

                <!-- Main Content -->
                <main class="dashboard-main">
                    <!-- Overview Section -->
                    <section id="overview" class="content-section active">
                        <h2>Overview</h2>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <div
                                    class="stat-icon"
                                    style="background: #e8f5e9"
                                >
                                    📊
                                </div>
                                <div class="stat-content">
                                    <div class="stat-label">
                                        Total Assessments
                                    </div>
                                    <div
                                        class="stat-value"
                                        id="totalAssessments"
                                    >
                                        0
                                    </div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div
                                    class="stat-icon"
                                    style="background: #c8e6c9"
                                >
                                    ✅
                                </div>
                                <div class="stat-content">
                                    <div class="stat-label">Approved</div>
                                    <div class="stat-value" id="approvedCount">
                                        0
                                    </div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div
                                    class="stat-icon"
                                    style="background: #a5d6a7"
                                >
                                    📝
                                </div>
                                <div class="stat-content">
                                    <div class="stat-label">Mitigated</div>
                                    <div class="stat-value" id="mitigatedCount">
                                        0
                                    </div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div
                                    class="stat-icon"
                                    style="background: #ffe082"
                                >
                                    ⏳
                                </div>
                                <div class="stat-content">
                                    <div class="stat-label">
                                        Pending Collateral
                                    </div>
                                    <div class="stat-value" id="pendingCount">
                                        0
                                    </div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div
                                    class="stat-icon"
                                    style="background: #ffcdd2"
                                >
                                    ❌
                                </div>
                                <div class="stat-content">
                                    <div class="stat-label">Rejected</div>
                                    <div class="stat-value" id="rejectedCount">
                                        0
                                    </div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div
                                    class="stat-icon"
                                    style="background: #b3e5fc"
                                >
                                    📈
                                </div>
                                <div class="stat-content">
                                    <div class="stat-label">Average Score</div>
                                    <div class="stat-value" id="averageScore">
                                        0.00
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="charts-grid">
                            <div class="chart-container">
                                <h3>Risk Zone Distribution</h3>
                                <canvas id="riskZoneChart"></canvas>
                            </div>

                            <div class="chart-container">
                                <h3>Assessment Status</h3>
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>

                        <div class="recent-section">
                            <h3>Recent Assessments</h3>
                            <div id="recentAssessments" class="recent-list">
                                <!-- Will be populated by JavaScript -->
                            </div>
                        </div>
                    </section>

                    <!-- Assessments Section -->
                    <section id="assessments" class="content-section">
                        <h2>All Assessments</h2>

                        <div class="filter-bar">
                            <input
                                type="text"
                                id="searchInput"
                                placeholder="Search by business or product..."
                                class="search-input"
                            />
                            <select id="statusFilter" class="filter-select">
                                <option value="">All Status</option>
                                <option value="draft">Draft</option>
                                <option value="submitted">Submitted</option>
                                <option value="approved">Approved</option>
                                <option value="mitigated">Mitigated</option>
                                <option value="pending_collateral">
                                    Pending Collateral
                                </option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>

                        <div id="assessmentsList" class="assessments-table">
                            <!-- Will be populated by JavaScript -->
                        </div>
                    </section>

                    <!-- Risk Zones and Settings removed per request -->
                </main>
            </div>
        </div>

        <div id="modal" class="modal" style="display: none">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <div id="modalBody">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
        <script src="js/app.js"></script>
        <script src="js/dashboard.js"></script>
    </body>
</html>
